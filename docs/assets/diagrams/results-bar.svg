<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 406" width="760" height="406" role="img" aria-labelledby="t d">
<title id="t">MAP@10 by model and direction</title>
<desc id="d">Grouped horizontal bars of test MAP@10. Random vectors: anime to game 0.0144, game to anime 0.0122; TF-IDF + SVD: anime to game 0.0483, game to anime 0.0458; Raw SBERT cosine: anime to game 0.0335, game to anime 0.0425; Siamese: anime to game 0.0602, game to anime 0.0842; Siamese + popularity prior: anime to game 0.0549, game to anime 0.0875.</desc>
