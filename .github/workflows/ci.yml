name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_RE: 'sk-ant-[A-Za-z0-9_-]{15,}|sk-(proj-)?[A-Za-z0-9]{20,}|sbp_[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[0-9A-Za-z-]{10,}|-----BEGIN [A-Z ]+PRIVATE KEY-----'

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Secret scan (regex fallback)
        run: |
          if git ls-files -z | xargs -0 grep -nIE -e "$SECRET_RE" --; then
            echo "FAIL: secret pattern found in tracked files"
            exit 1
          fi
          echo "PASS: no secret pattern in tracked files"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Typecheck
        run: |
          if [ -f mypy.ini ] || grep -qs '^\[tool\.mypy\]' pyproject.toml; then
            pip install mypy && mypy .
          elif [ -f pyrightconfig.json ] || grep -qs '^\[tool\.pyright\]' pyproject.toml; then
            pip install pyright && pyright
          else
            echo "SKIP: no mypy or pyright configuration"
          fi

      - name: Lint
        run: |
          if [ -f ruff.toml ] || [ -f .ruff.toml ] || grep -qs '^\[tool\.ruff' pyproject.toml; then
            pip install ruff && ruff check .
          else
            echo "SKIP: no ruff configuration"
          fi

      - name: Unit and ML tests
        run: |
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
            pip install pytest && pytest -q
          else
            echo "SKIP: no tests found"
          fi

      - name: App smoke check (compile)
        run: python -m py_compile app.py auth_utils.py

      - name: Streamlit boot and Playwright smoke test
        run: |
          mkdir -p .claude/qa
          streamlit run app.py --server.headless true --server.port 8501 > .claude/qa/streamlit.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health > /dev/null; then
              echo "PASS: Streamlit health endpoint responds"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "FAIL: Streamlit did not start in 30 seconds"
              exit 1
            fi
            sleep 1
          done
          if [ -d tests/e2e ]; then
            pip install pytest pytest-playwright
            python -m playwright install --with-deps chromium
            pytest -q tests/e2e --output .claude/qa/playwright
          else
            echo "SKIP: no Playwright tests in tests/e2e"
          fi

      - name: Upload QA artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: .claude/qa/
          if-no-files-found: ignore

  governance:
    name: Governance guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_PROJECT_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CLAUDE.md line count and duplicate rules
        run: bash "$CLAUDE_PROJECT_DIR/.claude/hooks/guard-claude-md.sh" --audit

      - name: Skill safety scan
        run: |
          bash "$CLAUDE_PROJECT_DIR/.claude/hooks/scan-skill.sh" all
          echo "PASS: skill scan clean"
